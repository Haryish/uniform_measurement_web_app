<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Next Template</title><style>body{font-family:system-ui;background:#f4f6f8;margin:0;color:#17202a}.wrap{max-width:850px;margin:50px auto;padding:20px}.card{background:white;border-radius:18px;padding:30px;box-shadow:0 8px 30px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{font-weight:650;display:block;margin-bottom:7px}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd2d9;border-radius:10px;background:white}button,a{display:inline-block;border:0;border-radius:10px;padding:12px 18px;font-weight:700;background:#17202a;color:white;text-decoration:none;cursor:pointer}.actions{margin-top:18px;display:flex;gap:10px}.muted{color:#667085}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>➡ Process next template</h1><p class="muted">The previously uploaded pattern workbook will be reused. Upload only the next school template.</p><form method="post" action="/"><div class="grid"><div><label>School template workbook(s)</label><input type="file" name="template_files" accept=".xlsx" multiple required></div><div><label>Assignment mode</label><select name="mode"><option value="round_robin">Round-robin patterns</option><option value="random">Random patterns</option></select><label style="margin-top:12px">Random seed</label><input type="number" name="seed" value="42"></div></div><p><label><input type="checkbox" name="fallback" checked> Use nearest class if exact class pattern is unavailable.</label><label><input type="checkbox" name="overwrite"> Overwrite existing measurement cells.</label></p><div class="actions"><button type="submit">⚡ Fill next file</button><a href="/">🔄 Change pattern workbook</a></div></form></div></div></body></html>
